<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>말랑말랑 탱탱볼 월드! - 화려한 레몬 테마</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game" id="gameCabinet">

  <div class="start-screen" id="startScreen">
    <h1>💛 탱탱볼 타임어택!</h1>
    <p>레버를 아래와 좌우로 당겨서 원하는 방향으로 조준하고 쏘세요!</p>
    <div class="difficulty-box">
      <button class="big-btn btn-easy" onclick="startGame('easy')">⭐ 쉬움 (왕 구멍)</button>
      <button class="big-btn btn-normal" onclick="startGame('normal')">⭐⭐ 보통 (보통 구멍)</button>
      <button class="big-btn btn-hard" onclick="startGame('hard')">⭐⭐⭐ 어려움 (바늘 구멍)</button>
    </div>
  </div>

  <div class="play-screen hidden" id="playScreen">
    <div class="top">
      <div class="timer">⏱️ <span id="time">60</span>초</div>
      <div class="score">🏆 <span id="score">0</span>점</div>
    </div>
    
    <div class="time-bar-container">
      <div class="time-bar" id="timeBar"></div>
    </div>

    <div class="game-area">
      <canvas id="gameCanvas" width="340" height="420"></canvas>
    </div>

    <div class="bottom-info">
      <span style="color:#ffffff;"><span id="feedback">레버를 사방으로 당겨서 조준하세요!</span></span>
      <span style="color:#ffee55;">🍭 한판 500원</span>
    </div>
  </div>

  <div class="end-screen hidden" id="endScreen">
    <h2>🎉 점수 대공개!</h2>
    <div class="stats">
      <p class="final-score-container">획득 점수: <span id="finalScore">0</span>점</p>
      <p>선택한 모드: <span id="finalDifficulty">-</span></p>
      <p>공을 쏜 횟수: <span id="totalCount">0</span>번</p>
      <p>골인 정확도: <span id="accuracy" class="accuracy">0%</span></p>
    </div>
    <button class="big-btn btn-restart" onclick="location.reload()">다시 도전하기!</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
